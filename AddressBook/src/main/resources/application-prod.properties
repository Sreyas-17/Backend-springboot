# MySQL Database Settings
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/addressbook_db}
spring.datasource.username=${DB_USERNAME:addressbook_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging Configuration
logging.level.com.bridgelabz.addressbook=ERROR
logging.level.org.springframework=ERROR
logging.file.name=addressbook.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n